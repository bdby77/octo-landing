<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background gradient — iOS-like blue→violet -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A9EFF"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Body highlight gradient -->
    <radialGradient id="body-hl" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </radialGradient>

    <!-- Tentacle gradient (slightly dimmer than head) -->
    <linearGradient id="tent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Drop shadow for the whole octopus -->
    <filter id="octo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dx="0" dy="20"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Specular highlight on top of head -->
    <radialGradient id="spec" cx="40%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded-square -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" fill="url(#bg)"/>

  <!-- Composed octopus -->
  <g filter="url(#octo-shadow)">
    <!-- Tentacles — eight curves radiating from body bottom -->
    <g fill="url(#tent)">
      <path d="M250 580
               Q210 680 240 790
               Q250 820 275 790
               Q290 760 265 720"/>
      <path d="M335 625
               Q305 760 345 850
               Q360 870 375 835
               Q385 790 355 760"/>
      <path d="M420 650
               Q400 820 440 905
               Q455 920 465 885
               Q470 835 440 810"/>
      <path d="M505 660
               Q500 850 530 930
               Q545 940 550 905
               Q552 855 525 835"/>
      <path d="M585 660
               Q600 850 580 930
               Q570 940 560 905
               Q557 855 580 835"/>
      <path d="M670 650
               Q700 820 660 905
               Q645 920 635 885
               Q630 835 660 810"/>
      <path d="M755 625
               Q790 760 755 850
               Q740 870 725 835
               Q715 790 745 760"/>
      <path d="M840 580
               Q890 680 850 790
               Q840 820 815 790
               Q800 760 825 720"/>
    </g>

    <!-- Head body -->
    <ellipse cx="512" cy="420" rx="300" ry="260" fill="url(#body-hl)"/>

    <!-- Specular highlight -->
    <ellipse cx="420" cy="260" rx="180" ry="100" fill="url(#spec)"/>

    <!-- Eyes — chunky, friendly -->
    <ellipse cx="420" cy="420" rx="38" ry="52" fill="#1a1a2e"/>
    <ellipse cx="604" cy="420" rx="38" ry="52" fill="#1a1a2e"/>

    <!-- Eye highlights -->
    <circle cx="432" cy="398" r="12" fill="#ffffff"/>
    <circle cx="416" cy="438" r="6"  fill="#ffffff" opacity="0.7"/>
    <circle cx="616" cy="398" r="12" fill="#ffffff"/>
    <circle cx="600" cy="438" r="6"  fill="#ffffff" opacity="0.7"/>

    <!-- Little smile -->
    <path d="M470 500 Q512 530 554 500"
          fill="none" stroke="#1a1a2e" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
